[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comp345-cuisine-experiment"
version = "0.1.0"
description = "Reproducible COMP 345 TF-IDF versus frozen Gemini embedding experiment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=7"]
report = ["matplotlib>=3.7"]

[project.scripts]
comp345 = "comp345.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
